name: Deploy database

# Ruta B: dos proyectos de Supabase (staging y producción) y este workflow.
# Si usás Supabase Branching con la integración de GitHub (ruta A), borrá
# este archivo: la integración aplica las migraciones al mergear.

on:
  push:
    branches: [main]
    paths: ["supabase/**"]

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref $PROJECT_ID
      - run: supabase db push
